<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NYC Subway Map</title>
<meta name="description" content="Ad-free, offline, zoomable NYC subway map: the official MTA day and late-night diagrams.">
<meta property="og:title" content="NYC Subway Map">
<meta property="og:description" content="Ad-free, offline, zoomable NYC subway map.">
<meta property="og:image" content="https://dianakarp.github.io/subwaymap/icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Subway Map">
<meta name="theme-color" content="#0f0f10">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0f0f10;
    overscroll-behavior: none;
  }
  #viewport {
    position: fixed;
    inset: 0;
    touch-action: none;
    cursor: grab;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #viewport.dragging { cursor: grabbing; }
  #world {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  #world img {
    position: absolute;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #world img.pending { visibility: hidden; }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: #9a9aa0;
    font: 16px -apple-system, "Segoe UI", sans-serif;
  }
  #modeBtn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(28, 28, 34, 0.82);
    color: #fff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
  }
  #modeBtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<div id="loading">Loading map…</div>
<div id="viewport">
  <div id="world">
    <img id="base" alt="NYC subway map" draggable="false">
  </div>
</div>
<button id="modeBtn" type="button" aria-label="Show late-night map" title="Show late-night map">&#9790;</button>
<script>
(function () {
  'use strict';

  const MAP_SIZE = {"w": 8000, "h": 9739, "levels": [{"z": 1, "w": 4000, "h": 4870}, {"z": 2, "w": 8000, "h": 9739}]}; // @map-size: written by tools/build_map.py
  const WORLD_W = MAP_SIZE.w, WORLD_H = MAP_SIZE.h;
  const TILE = 1024;
  const LEVELS = MAP_SIZE.levels.map(function (lev) {
    return { z: lev.z, w: lev.w, h: lev.h, s: lev.w / WORLD_W };
  });
  const MAPS = {
    day:   { base: 'base.png',       dir: 'tiles',       icon: '☾', label: 'Show late-night map' },
    night: { base: 'base-night.png', dir: 'tiles-night', icon: '☀', label: 'Show daytime map' }
  };
  const VIEW_KEY = 'subwaymap.view';

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const base = document.getElementById('base');
  const loading = document.getElementById('loading');
  const modeBtn = document.getElementById('modeBtn');
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // The overview image is stretched over the whole map; tiles sit on top of it.
  base.style.left = '0px';
  base.style.top = '0px';
  base.style.width = WORLD_W + 'px';
  base.style.height = WORLD_H + 'px';

  let mode = 'day';
  let scale = 1, tx = 0, ty = 0;
  let fitScale = 1, maxScale = 4;
  let vw = 0, vh = 0;
  let ready = false, interacted = false;
  let anim = 0;

  function load(key) { try { return localStorage.getItem(key); } catch (err) { return null; } }
  function store(key, value) { try { localStorage.setItem(key, value); } catch (err) { /* private mode */ } }

  // ---- View geometry ----

  function measure() {
    vw = viewport.clientWidth;
    vh = viewport.clientHeight;
    fitScale = Math.min(vw / WORLD_W, vh / WORLD_H);
    maxScale = Math.max(fitScale * 12, 1.2);
  }

  function clamp() {
    scale = Math.min(Math.max(scale, fitScale), maxScale);
    const w = WORLD_W * scale, h = WORLD_H * scale;
    tx = w <= vw ? (vw - w) / 2 : Math.min(0, Math.max(vw - w, tx));
    ty = h <= vh ? (vh - h) / 2 : Math.min(0, Math.max(vh - h, ty));
  }

  function apply() {
    world.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
    scheduleTiles();
    scheduleSave();
  }

  function zoomAbout(mx, my, newScale) {
    newScale = Math.min(Math.max(newScale, fitScale), maxScale);
    const f = newScale / scale;
    tx = mx - (mx - tx) * f;
    ty = my - (my - ty) * f;
    scale = newScale;
    clamp();
    apply();
  }

  // Put map point (wx, wy) in the middle of the screen at zoom s.
  function centerOn(wx, wy, s) {
    scale = Math.min(Math.max(s, fitScale), maxScale);
    tx = vw / 2 - wx * scale;
    ty = vh / 2 - wy * scale;
    clamp();
  }

  // ---- Animation: smooth zoom and momentum after a flick ----

  function stopAnimation() {
    if (anim) { cancelAnimationFrame(anim); anim = 0; }
  }

  function animateZoom(mx, my, target, ms) {
    stopAnimation();
    target = Math.min(Math.max(target, fitScale), maxScale);
    if (reduceMotion) { zoomAbout(mx, my, target); return; }
    const s0 = scale, wx = (mx - tx) / scale, wy = (my - ty) / scale, t0 = performance.now();
    function frame(now) {
      const p = Math.min(1, (now - t0) / ms);
      scale = s0 * Math.pow(target / s0, 1 - Math.pow(1 - p, 3));
      tx = mx - wx * scale;
      ty = my - wy * scale;
      clamp();
      apply();
      anim = p < 1 ? requestAnimationFrame(frame) : 0;
    }
    anim = requestAnimationFrame(frame);
  }

  function fling(vx, vy) { // pixels per millisecond
    stopAnimation();
    if (reduceMotion) return;
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(now - last, 40);
      last = now;
      const decay = Math.pow(0.996, dt);
      vx *= decay;
      vy *= decay;
      const wantX = tx + vx * dt, wantY = ty + vy * dt;
      tx = wantX;
      ty = wantY;
      clamp();
      if (Math.abs(tx - wantX) > 0.5) vx = 0; // hit an edge
      if (Math.abs(ty - wantY) > 0.5) vy = 0;
      apply();
      anim = Math.abs(vx) + Math.abs(vy) > 0.02 ? requestAnimationFrame(frame) : 0;
    }
    anim = requestAnimationFrame(frame);
  }

  // ---- Remember where you were ----

  let saveTimer = 0;
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveView, 400);
  }
  function saveView() {
    if (!ready) return;
    store(VIEW_KEY, JSON.stringify({
      x: Math.round((vw / 2 - tx) / scale),
      y: Math.round((vh / 2 - ty) / scale),
      z: Math.round(scale / fitScale * 1000) / 1000
    }));
  }
  function restoreView() {
    let v = null;
    try { v = JSON.parse(load(VIEW_KEY)); } catch (err) { /* ignore */ }
    if (!v || !isFinite(v.x) || !isFinite(v.y) || !isFinite(v.z)) return false;
    centerOn(v.x, v.y, fitScale * v.z);
    return true;
  }

  // ---- Tiles ----
  // The overview image is always there; sharper 1024px tiles load on top for
  // whatever is on screen. When the zoom level or the map changes, the old
  // tiles stay up until the new ones are ready, so nothing flashes blurry.

  const tiles = new Map(); // "mode/z/x_y" -> <img>
  let wanted = new Set();
  let tileTimer = 0, sweepTimer = 0;

  function scheduleTiles() {
    if (!tileTimer) tileTimer = setTimeout(function () { tileTimer = 0; updateTiles(); }, 100);
  }

  function pickLevel() {
    const need = scale * (window.devicePixelRatio || 1) * WORLD_W;
    if (need <= (base.naturalWidth || 2000) * 1.3) return null;
    for (let i = 0; i < LEVELS.length; i++) {
      if (need <= LEVELS[i].w * 1.3) return LEVELS[i];
    }
    return LEVELS[LEVELS.length - 1];
  }

  function updateTiles() {
    if (!ready) return;
    const lev = pickLevel();
    const layer = lev ? mode + '/' + lev.z + '/' : '';
    wanted = new Set();

    if (lev) {
      const mx = vw * 0.3, my = vh * 0.3;
      const x0 = (-tx - mx) / scale, y0 = (-ty - my) / scale;
      const x1 = (-tx + vw + mx) / scale, y1 = (-ty + vh + my) / scale;
      const tw = TILE / lev.s;
      const cols = Math.ceil(lev.w / TILE), rows = Math.ceil(lev.h / TILE);
      const cx0 = Math.max(0, Math.floor(x0 / tw)), cy0 = Math.max(0, Math.floor(y0 / tw));
      const cx1 = Math.min(cols - 1, Math.floor(x1 / tw)), cy1 = Math.min(rows - 1, Math.floor(y1 / tw));
      for (let x = cx0; x <= cx1; x++) {
        for (let y = cy0; y <= cy1; y++) {
          const key = layer + x + '_' + y;
          wanted.add(key);
          const img = tiles.get(key);
          if (img && img.dataset.failed) removeTile(key); // try again
          if (!tiles.has(key)) addTile(key, lev, x, y);
        }
      }
    }

    tiles.forEach(function (img, key) {
      if (!wanted.has(key) && layer && key.indexOf(layer) === 0) removeTile(key);
    });
    clearTimeout(sweepTimer);
    sweepTimer = 0;
    settle(false);
  }

  function addTile(key, lev, x, y) {
    const img = document.createElement('img');
    const tw = TILE / lev.s;
    img.className = 'pending';
    img.alt = '';
    img.decoding = 'async';
    img.draggable = false;
    img.style.left = (x * tw) + 'px';
    img.style.top = (y * tw) + 'px';
    img.style.width = (Math.min(TILE, lev.w - x * TILE) / lev.s) + 'px';
    img.style.height = (Math.min(TILE, lev.h - y * TILE) / lev.s) + 'px';
    img.onload = function () { img.dataset.done = '1'; settle(false); };
    img.onerror = function () { img.dataset.done = '1'; img.dataset.failed = '1'; settle(false); };
    img.src = MAPS[mode].dir + '/' + lev.z + '/' + x + '_' + y + '.png';
    world.appendChild(img);
    tiles.set(key, img);
  }

  function removeTile(key) {
    const img = tiles.get(key);
    if (!img) return;
    img.onload = img.onerror = null;
    img.remove();
    tiles.delete(key);
  }

  function settle(force) {
    let waiting = 0, stale = 0;
    tiles.forEach(function (img, key) {
      if (!wanted.has(key)) stale++;
      else if (!img.dataset.done) waiting++;
    });
    if (stale && waiting && !force) {
      // New tiles are loading over old ones: wait so they appear together,
      // but not forever if one is slow.
      if (!sweepTimer) sweepTimer = setTimeout(function () { sweepTimer = 0; settle(true); }, 1500);
      return;
    }
    clearTimeout(sweepTimer);
    sweepTimer = 0;
    tiles.forEach(function (img, key) {
      if (!wanted.has(key)) removeTile(key);
      else if (img.dataset.done && !img.dataset.failed) img.classList.remove('pending');
    });
  }

  // ---- Day / late-night map ----

  function setMode(next, remember) {
    mode = next;
    if (remember) store('mapMode', mode);
    modeBtn.textContent = MAPS[mode].icon;
    modeBtn.setAttribute('aria-label', MAPS[mode].label);
    modeBtn.title = MAPS[mode].label;
    base.src = MAPS[mode].base;
    scheduleTiles();
  }

  modeBtn.addEventListener('click', function () {
    interacted = true;
    setMode(mode === 'day' ? 'night' : 'day', true);
  });

  // ---- Start ----

  function start() {
    if (ready) return;
    measure();
    if (!vw || !vh) { requestAnimationFrame(start); return; }
    ready = true;
    loading.style.display = 'none';
    if (!restoreView()) { scale = fitScale; clamp(); }
    apply();
  }

  base.addEventListener('load', start);
  base.addEventListener('error', function () {
    if (!ready) loading.textContent = 'Couldn’t load the map. Check your connection and try again.';
  });
  setMode(load('mapMode') === 'night' ? 'night' : 'day', false);

  window.addEventListener('resize', function () {
    if (!ready) return;
    const wasFit = scale <= fitScale * 1.001;
    const cx = (vw / 2 - tx) / scale, cy = (vh / 2 - ty) / scale;
    measure();
    if (!vw || !vh) return;
    if (wasFit) { scale = fitScale; clamp(); } else { centerOn(cx, cy, scale); }
    apply();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') saveView();
  });
  window.addEventListener('pagehide', saveView);

  // ---- Touch and mouse ----
  // Drag to pan (with momentum), pinch to zoom, double-tap to zoom in or back
  // out. One hand: double-tap and hold, then slide down to zoom in, up to zoom out.

  const pointers = new Map();
  let gesture = '', pinched = false, moved = false;
  let downAt = 0, downX = 0, downY = 0;
  let lastTapAt = 0, lastTapX = 0, lastTapY = 0;
  let zoomX = 0, zoomY = 0, zoomStartScale = 1;
  let samples = [];

  viewport.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    interacted = true;
    stopAnimation();
    try { viewport.setPointerCapture(e.pointerId); } catch (err) { /* pointer may already be gone */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    viewport.classList.add('dragging');
    const now = performance.now();

    if (pointers.size === 1) {
      const dx = e.clientX - lastTapX, dy = e.clientY - lastTapY;
      gesture = now - lastTapAt < 300 && dx * dx + dy * dy < 900 ? 'tapzoom' : 'pan';
      lastTapAt = 0;
      pinched = false;
      moved = false;
      downAt = now;
      downX = zoomX = e.clientX;
      downY = zoomY = e.clientY;
      zoomStartScale = scale;
      samples = [{ t: now, x: e.clientX, y: e.clientY }];
    } else {
      gesture = 'pinch';
      pinched = true;
    }
  });

  viewport.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 10) moved = true;

    if (gesture === 'tapzoom') {
      if (moved) zoomAbout(zoomX, zoomY, zoomStartScale * Math.exp((e.clientY - downY) / 150));
    } else if (pointers.size === 1) {
      tx += e.clientX - prev.x;
      ty += e.clientY - prev.y;
      const now = performance.now();
      samples.push({ t: now, x: e.clientX, y: e.clientY });
      while (samples.length > 2 && now - samples[0].t > 100) samples.shift();
      clamp();
      apply();
    } else if (pointers.size === 2) {
      let other = null;
      pointers.forEach(function (p, id) { if (id !== e.pointerId) other = p; });
      const prevMidX = (prev.x + other.x) / 2, prevMidY = (prev.y + other.y) / 2;
      const prevDist = Math.hypot(prev.x - other.x, prev.y - other.y);
      const newMidX = (e.clientX + other.x) / 2, newMidY = (e.clientY + other.y) / 2;
      const newDist = Math.hypot(e.clientX - other.x, e.clientY - other.y);
      if (prevDist === 0) return;
      const newScale = Math.min(Math.max(scale * (newDist / prevDist), fitScale), maxScale);
      const f = newScale / scale;
      tx = newMidX - (prevMidX - tx) * f;
      ty = newMidY - (prevMidY - ty) * f;
      scale = newScale;
      clamp();
      apply();
    }
  });

  function release(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    const now = performance.now();

    if (pointers.size === 1) {
      // Lifted one finger of a pinch: carry on panning with the other.
      gesture = 'pan';
      samples = [];
      return;
    }
    if (pointers.size > 0) return;
    viewport.classList.remove('dragging');
    const ended = e.type === 'pointerup';

    if (gesture === 'tapzoom') {
      if (ended && !moved) {
        animateZoom(zoomX, zoomY, scale < fitScale * 2.5 ? fitScale * 3.5 : fitScale, 250);
      }
    } else if (gesture === 'pan' && !pinched && ended) {
      if (!moved && now - downAt < 300) {
        lastTapAt = now; // maybe the first half of a double-tap
        lastTapX = e.clientX;
        lastTapY = e.clientY;
      } else if (samples.length > 1) {
        const first = samples[0], last = samples[samples.length - 1];
        const dt = last.t - first.t;
        if (dt > 0 && now - last.t < 80) {
          const vx = (last.x - first.x) / dt, vy = (last.y - first.y) / dt;
          if (Math.hypot(vx, vy) > 0.25) fling(vx, vy);
        }
      }
    }
    gesture = '';
  }
  viewport.addEventListener('pointerup', release);
  viewport.addEventListener('pointercancel', release);

  viewport.addEventListener('wheel', function (e) {
    e.preventDefault();
    interacted = true;
    stopAnimation();
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 16;      // lines
    else if (e.deltaMode === 2) dy *= vh; // pages
    dy = Math.max(-300, Math.min(300, dy));
    // Trackpad pinches arrive as ctrl+wheel with small deltas.
    zoomAbout(e.clientX, e.clientY, scale * Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.002)));
  }, { passive: false });

  // Safari on a Mac sends trackpad pinches as gesture events. (On iPhone the
  // pointer events above already handle pinches, so ignore these there.)
  let gestureStartScale = 1;
  viewport.addEventListener('gesturestart', function (e) {
    e.preventDefault();
    gestureStartScale = scale;
  });
  viewport.addEventListener('gesturechange', function (e) {
    e.preventDefault();
    if (pointers.size) return;
    zoomAbout(e.clientX, e.clientY, gestureStartScale * e.scale);
  });

  // ---- Keyboard: + / - to zoom, 0 to see the whole map, arrows to move ----

  window.addEventListener('keydown', function (e) {
    if (!ready || e.metaKey || e.ctrlKey || e.altKey) return;
    const step = Math.round(Math.min(vw, vh) * 0.25);
    switch (e.key) {
      case '+': case '=': animateZoom(vw / 2, vh / 2, scale * 1.6, 200); break;
      case '-': case '_': animateZoom(vw / 2, vh / 2, scale / 1.6, 200); break;
      case '0': animateZoom(vw / 2, vh / 2, fitScale, 250); break;
      case 'ArrowLeft': tx += step; clamp(); apply(); break;
      case 'ArrowRight': tx -= step; clamp(); apply(); break;
      case 'ArrowUp': ty += step; clamp(); apply(); break;
      case 'ArrowDown': ty -= step; clamp(); apply(); break;
      default: return;
    }
    interacted = true;
    e.preventDefault();
  });

  // ---- Offline support and updates ----

  if ('serviceWorker' in navigator) {
    let hadController = !!navigator.serviceWorker.controller;
    let reloadOnReturn = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController) { hadController = true; return; } // first install: this page is already current
      // A new map or app version is ready. Switch now if nobody's using the
      // page yet; otherwise the next time the app is opened.
      if (!interacted || document.visibilityState === 'hidden') location.reload();
      else reloadOnReturn = true;
    });
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      let lastCheck = Date.now();
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState !== 'visible') return;
        if (reloadOnReturn) { location.reload(); return; }
        // Home-screen apps often resume instead of relaunching, so check for a
        // new map now and then.
        if (Date.now() - lastCheck > 60 * 60 * 1000) {
          lastCheck = Date.now();
          reg.update().catch(function () { /* offline */ });
        }
      });
    }).catch(function (err) {
      console.warn('Service worker registration failed:', err);
    });
  }
})();
</script>
</body>
</html>
