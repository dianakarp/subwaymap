<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NYC Subway Map</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Subway Map">
<meta name="theme-color" content="#0f0f10">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0f0f10;
    overscroll-behavior: none;
  }
  #viewport {
    position: fixed;
    inset: 0;
    touch-action: none;
    cursor: grab;
    -webkit-user-select: none;
    user-select: none;
  }
  #viewport.dragging { cursor: grabbing; }
  #world {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
    will-change: transform;
  }
  #world img {
    position: absolute;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #9a9aa0;
    font: 16px -apple-system, "Segoe UI", sans-serif;
  }
  #modeBtn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: 12px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(28, 28, 34, 0.82);
    color: #fff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    z-index: 10;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<div id="loading">Loading map…</div>
<div id="viewport">
  <div id="world">
    <img id="base" src="base.png" alt="NYC Subway map" draggable="false">
  </div>
</div>
<button id="modeBtn" type="button" aria-label="Switch between day and late-night map">&#9790;</button>
<script>
(function () {
  const WORLD_W = 8000, WORLD_H = 9739;
  const TILE = 1024;
  const LEVELS = [
    { z: 1, w: 4000, h: 4870, s: 0.5 },
    { z: 2, w: 8000, h: 9739, s: 1 }
  ];
  const MAPS = {
    day:   { base: 'base.png',       dir: 'tiles' },
    night: { base: 'base-night.png', dir: 'tiles-night' }
  };

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const base = document.getElementById('base');
  const loading = document.getElementById('loading');
  const modeBtn = document.getElementById('modeBtn');

  let mode = 'day';
  try { if (localStorage.getItem('mapMode') === 'night') mode = 'night'; } catch (err) { /* private mode */ }
  base.src = MAPS[mode].base;
  modeBtn.textContent = mode === 'day' ? '☾' : '☀';

  base.style.left = '0px';
  base.style.top = '0px';
  base.style.width = WORLD_W + 'px';
  base.style.height = WORLD_H + 'px';

  let scale = 1, tx = 0, ty = 0;
  let fitScale = 1, maxScale = 4;

  const pointers = new Map();
  let lastTapTime = 0, lastTapX = 0, lastTapY = 0;

  const tiles = new Map();
  let tileTimer = 0;

  function pickLevel() {
    const need = scale * (window.devicePixelRatio || 1) * WORLD_W;
    if (need <= 2600) return null;
    if (need <= 5200) return LEVELS[0];
    return LEVELS[1];
  }

  function updateTiles() {
    const lev = pickLevel();
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const mx = vw * 0.3, my = vh * 0.3;
    const x0 = (-tx - mx) / scale, y0 = (-ty - my) / scale;
    const x1 = (-tx + vw + mx) / scale, y1 = (-ty + vh + my) / scale;

    if (lev) {
      const tw = TILE / lev.s;
      const cols = Math.ceil(lev.w / TILE), rows = Math.ceil(lev.h / TILE);
      const cx0 = Math.max(0, Math.floor(x0 / tw)), cy0 = Math.max(0, Math.floor(y0 / tw));
      const cx1 = Math.min(cols - 1, Math.floor(x1 / tw)), cy1 = Math.min(rows - 1, Math.floor(y1 / tw));
      for (let x = cx0; x <= cx1; x++) {
        for (let y = cy0; y <= cy1; y++) {
          const key = lev.z + '_' + x + '_' + y;
          if (tiles.has(key)) continue;
          const img = document.createElement('img');
          img.decoding = 'async';
          img.draggable = false;
          img.src = MAPS[mode].dir + '/' + lev.z + '/' + x + '_' + y + '.png';
          const pw = Math.min(TILE, lev.w - x * TILE), ph = Math.min(TILE, lev.h - y * TILE);
          img.style.left = (x * tw) + 'px';
          img.style.top = (y * tw) + 'px';
          img.style.width = (pw / lev.s) + 'px';
          img.style.height = (ph / lev.s) + 'px';
          world.appendChild(img);
          tiles.set(key, img);
        }
      }
    }

    tiles.forEach(function (img, key) {
      const parts = key.split('_');
      const z = +parts[0], x = +parts[1], y = +parts[2];
      let keep = false;
      if (lev && z === lev.z) {
        const tw = TILE / lev.s;
        const left = x * tw, top = y * tw;
        keep = left < x1 && left + tw > x0 && top < y1 && top + tw > y0;
      }
      if (!keep) { img.remove(); tiles.delete(key); }
    });
  }

  function apply() {
    world.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
    clearTimeout(tileTimer);
    tileTimer = setTimeout(updateTiles, 60);
  }

  function clamp() {
    scale = Math.min(Math.max(scale, fitScale), maxScale);
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    const w = WORLD_W * scale, h = WORLD_H * scale;
    if (w <= vw) { tx = (vw - w) / 2; }
    else { tx = Math.min(0, Math.max(vw - w, tx)); }
    if (h <= vh) { ty = (vh - h) / 2; }
    else { ty = Math.min(0, Math.max(vh - h, ty)); }
  }

  function zoomAbout(mx, my, newScale) {
    newScale = Math.min(Math.max(newScale, fitScale), maxScale);
    const f = newScale / scale;
    tx = mx - (mx - tx) * f;
    ty = my - (my - ty) * f;
    scale = newScale;
    clamp();
    apply();
  }

  function fitToScreen() {
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    fitScale = Math.min(vw / WORLD_W, vh / WORLD_H);
    maxScale = Math.max(fitScale * 12, 1.2);
    scale = fitScale;
    tx = (vw - WORLD_W * scale) / 2;
    ty = (vh - WORLD_H * scale) / 2;
    apply();
  }

  function init() {
    if (viewport.clientWidth === 0 || viewport.clientHeight === 0) {
      requestAnimationFrame(init);
      return;
    }
    loading.style.display = 'none';
    fitToScreen();
  }
  if (base.complete && base.naturalWidth) { init(); }
  else { base.addEventListener('load', init, { once: true }); }
  base.addEventListener('error', function () {
    loading.textContent = 'Could not load map (base.png missing).';
  });

  window.addEventListener('resize', function () {
    const wasAtFit = Math.abs(scale - fitScale) < 0.001;
    const vw = viewport.clientWidth, vh = viewport.clientHeight;
    fitScale = Math.min(vw / WORLD_W, vh / WORLD_H);
    maxScale = Math.max(fitScale * 12, 1.2);
    if (wasAtFit) { fitToScreen(); } else { clamp(); apply(); }
  });

  viewport.addEventListener('pointerdown', function (e) {
    try { viewport.setPointerCapture(e.pointerId); } catch (err) { /* pointer may already be gone */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    viewport.classList.add('dragging');

    if (pointers.size === 1) {
      const now = Date.now();
      const dx = e.clientX - lastTapX, dy = e.clientY - lastTapY;
      if (now - lastTapTime < 300 && dx * dx + dy * dy < 900) {
        const target = scale < fitScale * 2.5 ? fitScale * 3.5 : fitScale;
        zoomAbout(e.clientX, e.clientY, target);
        lastTapTime = 0;
      } else {
        lastTapTime = now; lastTapX = e.clientX; lastTapY = e.clientY;
      }
    }
  });

  viewport.addEventListener('pointermove', function (e) {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);

    if (pointers.size === 1) {
      tx += e.clientX - prev.x;
      ty += e.clientY - prev.y;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      clamp();
      apply();
    } else if (pointers.size === 2) {
      const ids = [];
      pointers.forEach(function (v, id) { ids.push(id); });
      const otherId = ids[0] === e.pointerId ? ids[1] : ids[0];
      const other = pointers.get(otherId);

      const prevMidX = (prev.x + other.x) / 2, prevMidY = (prev.y + other.y) / 2;
      const prevDist = Math.hypot(prev.x - other.x, prev.y - other.y);

      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const newMidX = (e.clientX + other.x) / 2, newMidY = (e.clientY + other.y) / 2;
      const newDist = Math.hypot(e.clientX - other.x, e.clientY - other.y);
      if (prevDist === 0) return;

      const newScale = Math.min(Math.max(scale * (newDist / prevDist), fitScale), maxScale);
      const f = newScale / scale;
      tx = newMidX - (prevMidX - tx) * f;
      ty = newMidY - (prevMidY - ty) * f;
      scale = newScale;
      clamp();
      apply();
    }
  });

  function releasePointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) viewport.classList.remove('dragging');
  }
  viewport.addEventListener('pointerup', releasePointer);
  viewport.addEventListener('pointercancel', releasePointer);

  viewport.addEventListener('wheel', function (e) {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.002);
    zoomAbout(e.clientX, e.clientY, scale * factor);
  }, { passive: false });

  modeBtn.addEventListener('click', function () {
    mode = mode === 'day' ? 'night' : 'day';
    try { localStorage.setItem('mapMode', mode); } catch (err) { /* private mode */ }
    modeBtn.textContent = mode === 'day' ? '☾' : '☀';
    tiles.forEach(function (img) { img.remove(); });
    tiles.clear();
    base.src = MAPS[mode].base;
    clearTimeout(tileTimer);
    tileTimer = setTimeout(updateTiles, 60);
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function (err) {
      console.warn('Service worker registration failed:', err);
    });
  }
})();
</script>
</body>
</html>
